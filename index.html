<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#090d12">
  <title>Neon Snake</title>
  <style>
    :root {
      color-scheme: dark;
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      font-synthesis: none;
      text-rendering: optimizeLegibility;
      -webkit-font-smoothing: antialiased;
      --page: #090d12;
      --panel: #10171f;
      --panel-raised: #141d27;
      --line: #202c37;
      --text: #e8f0f4;
      --muted: #83919d;
      --green: #b8ff4f;
      --green-bright: #d6ff83;
      --pink: #ff5ba8;
      --canvas: #0b1117;
    }

    * { box-sizing: border-box; }

    body {
      min-width: 320px;
      min-height: 100vh;
      margin: 0;
      display: grid;
      place-items: center;
      padding: 36px 20px;
      background:
        radial-gradient(ellipse at 50% 0%, rgba(28, 48, 58, .34), transparent 52%),
        var(--page);
      color: var(--text);
      font-size: 15px;
    }

    button { font: inherit; }

    .app {
      width: min(100%, 760px);
    }

    .topline {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 22px;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .brand-mark {
      display: grid;
      width: 38px;
      height: 38px;
      place-items: center;
      border: 1px solid rgba(184, 255, 79, .24);
      border-radius: 12px;
      background: rgba(184, 255, 79, .08);
      color: var(--green);
      font-size: 21px;
      line-height: 1;
      box-shadow: 0 0 24px rgba(184, 255, 79, .08);
    }

    h1 {
      margin: 0;
      font-size: 17px;
      font-weight: 650;
      letter-spacing: -.02em;
    }

    .eyebrow {
      margin-top: 3px;
      color: var(--muted);
      font-size: 12px;
      letter-spacing: .015em;
    }

    .live-pill {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 7px 10px;
      border: 1px solid var(--line);
      border-radius: 999px;
      color: #a8b4be;
      font-size: 11px;
      font-weight: 600;
      letter-spacing: .09em;
      text-transform: uppercase;
    }

    .live-dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: var(--green);
      box-shadow: 0 0 10px rgba(184, 255, 79, .7);
    }

    .scorebar {
      display: flex;
      gap: 12px;
      margin-bottom: 12px;
    }

    .score-card {
      display: flex;
      flex: 1;
      align-items: center;
      justify-content: space-between;
      min-height: 65px;
      padding: 12px 17px;
      border: 1px solid var(--line);
      border-radius: 13px;
      background: linear-gradient(145deg, rgba(20, 29, 39, .92), rgba(14, 21, 29, .94));
    }

    .score-label {
      color: var(--muted);
      font-size: 11px;
      font-weight: 650;
      letter-spacing: .11em;
      text-transform: uppercase;
    }

    .score-value {
      color: var(--text);
      font-size: 22px;
      font-variant-numeric: tabular-nums;
      font-weight: 650;
      letter-spacing: -.04em;
    }

    .score-card:first-child .score-value { color: var(--green-bright); }

    .skin-picker {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 14px;
      min-height: 54px;
      margin-bottom: 12px;
      padding: 9px 15px;
      border: 1px solid var(--line);
      border-radius: 12px;
      background: rgba(16, 23, 31, .82);
    }

    .skin-picker-label {
      color: var(--muted);
      font-size: 11px;
      font-weight: 650;
      letter-spacing: .11em;
      text-transform: uppercase;
    }

    .skin-options {
      display: flex;
      align-items: center;
      gap: 9px;
    }

    .skin-swatch {
      display: grid;
      width: 29px;
      height: 29px;
      place-items: center;
      padding: 0;
      border: 1px solid transparent;
      border-radius: 50%;
      background: transparent;
      cursor: pointer;
      transition: border-color .15s ease, transform .15s ease;
    }

    .skin-swatch:hover { transform: scale(1.1); }

    .skin-swatch[aria-pressed="true"] {
      border-color: var(--swatch);
      box-shadow: 0 0 12px color-mix(in srgb, var(--swatch) 26%, transparent);
    }

    .skin-swatch::before {
      width: 13px;
      height: 13px;
      border: 1px solid rgba(255, 255, 255, .24);
      border-radius: 50%;
      background: var(--swatch);
      content: "";
      box-shadow: 0 0 9px color-mix(in srgb, var(--swatch) 48%, transparent);
    }

    .game-shell {
      position: relative;
      overflow: hidden;
      border: 1px solid #26343e;
      border-radius: 17px;
      background: var(--canvas);
      box-shadow: 0 24px 80px rgba(0, 0, 0, .32), 0 0 0 5px rgba(255, 255, 255, .012);
      isolation: isolate;
      touch-action: none;
    }

    canvas {
      display: block;
      width: 100%;
      aspect-ratio: 40 / 27;
    }

    .overlay {
      position: absolute;
      inset: 0;
      display: grid;
      place-items: center;
      padding: 24px;
      background: rgba(7, 11, 15, .66);
      backdrop-filter: blur(5px);
      transition: opacity .2s ease, visibility .2s ease;
    }

    .overlay[hidden] {
      display: none;
    }

    .dialog {
      width: min(100%, 330px);
      padding: 27px 25px 24px;
      border: 1px solid rgba(167, 192, 202, .16);
      border-radius: 18px;
      background: rgba(17, 25, 33, .94);
      text-align: center;
      box-shadow: 0 18px 60px rgba(0, 0, 0, .34);
    }

    .dialog-icon {
      display: grid;
      width: 48px;
      height: 48px;
      place-items: center;
      margin: 0 auto 16px;
      border: 1px solid rgba(184, 255, 79, .2);
      border-radius: 15px;
      background: rgba(184, 255, 79, .08);
      color: var(--green);
      font-size: 24px;
    }

    .dialog h2 {
      margin: 0;
      font-size: 22px;
      font-weight: 650;
      letter-spacing: -.035em;
    }

    .dialog p {
      margin: 9px 0 20px;
      color: #9aa8b3;
      font-size: 14px;
      line-height: 1.55;
    }

    .primary-button {
      width: 100%;
      min-height: 45px;
      border: 0;
      border-radius: 10px;
      background: var(--green);
      color: #152009;
      cursor: pointer;
      font-weight: 700;
      transition: background .15s ease, transform .15s ease;
    }

    .primary-button:hover { background: var(--green-bright); }
    .primary-button:active { transform: translateY(1px); }
    button:focus-visible { outline: 2px solid var(--green-bright); outline-offset: 3px; }

    .bottomline {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      padding: 15px 2px 0;
      color: var(--muted);
      font-size: 12px;
    }

    .controls {
      display: flex;
      align-items: center;
      gap: 7px;
    }

    kbd {
      min-width: 24px;
      padding: 4px 6px;
      border: 1px solid #293641;
      border-radius: 6px;
      background: #111921;
      color: #c3cdd4;
      font-family: inherit;
      font-size: 11px;
      text-align: center;
      box-shadow: 0 2px 0 #080c10;
    }

    .hint { text-align: right; }

    @media (prefers-color-scheme: light) {
      :root {
        --page: #10171c;
        --panel: #151e25;
        --panel-raised: #19242c;
      }
    }

    @media (max-width: 540px) {
      body { padding: 22px 14px; }
      .topline { margin-bottom: 17px; }
      .score-card { min-height: 58px; padding: 10px 13px; }
      .score-value { font-size: 20px; }
      .skin-picker { min-height: 49px; padding-inline: 12px; }
      .skin-options { gap: 6px; }
      .bottomline { align-items: flex-start; font-size: 11px; }
      .controls { flex-wrap: wrap; }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { scroll-behavior: auto !important; transition-duration: .01ms !important; }
    }
  </style>
</head>
<body>
  <main class="app">
    <header class="topline">
      <div class="brand">
        <div class="brand-mark" aria-hidden="true">⌁</div>
        <div>
          <h1>Neon Snake</h1>
          <div class="eyebrow">A classic, with a little more glow</div>
        </div>
      </div>
      <div class="live-pill"><span class="live-dot" aria-hidden="true"></span> Arcade mode</div>
    </header>

    <section class="scorebar" aria-label="Game score">
      <div class="score-card">
        <span class="score-label">Score</span>
        <span class="score-value" id="score">000</span>
      </div>
      <div class="score-card">
        <span class="score-label">Best</span>
        <span class="score-value" id="best">000</span>
      </div>
    </section>

    <section class="skin-picker" aria-label="Snake skin">
      <span class="skin-picker-label">Snake skin</span>
      <div class="skin-options" role="group" aria-label="Choose a snake color">
        <button class="skin-swatch" type="button" data-skin="lime" style="--swatch:#b8ff4f" aria-label="Lime skin" aria-pressed="true"></button>
        <button class="skin-swatch" type="button" data-skin="cyan" style="--swatch:#55e6ff" aria-label="Cyber cyan skin" aria-pressed="false"></button>
        <button class="skin-swatch" type="button" data-skin="violet" style="--swatch:#c18aff" aria-label="Violet skin" aria-pressed="false"></button>
        <button class="skin-swatch" type="button" data-skin="orange" style="--swatch:#ffad5c" aria-label="Solar orange skin" aria-pressed="false"></button>
      </div>
    </section>

    <section class="game-shell" aria-label="Snake game">
      <canvas id="game" aria-label="Game board. Use arrow keys or WASD to steer the snake." role="img"></canvas>
      <div class="overlay" id="overlay">
        <div class="dialog" role="dialog" aria-modal="true" aria-labelledby="dialog-title">
          <div class="dialog-icon" id="dialog-icon" aria-hidden="true">✦</div>
          <h2 id="dialog-title">Ready to play?</h2>
          <p id="dialog-copy">Collect the glowing orbs, grow your snake, and see how high you can score.</p>
          <button class="primary-button" id="start-button" type="button">Start game</button>
        </div>
      </div>
    </section>

    <footer class="bottomline">
      <div class="controls" aria-label="Controls">
        <span>Move</span><kbd>↑</kbd><kbd>←</kbd><kbd>↓</kbd><kbd>→</kbd><span>or WASD</span>
      </div>
      <div class="hint">Eat to grow · Don’t hit the walls or yourself</div>
    </footer>
  </main>

  <script>
    (() => {
      const canvas = document.getElementById("game");
      const ctx = canvas.getContext("2d");
      const shell = document.querySelector(".game-shell");
      const overlay = document.getElementById("overlay");
      const startButton = document.getElementById("start-button");
      const title = document.getElementById("dialog-title");
      const copy = document.getElementById("dialog-copy");
      const icon = document.getElementById("dialog-icon");
      const scoreLabel = document.getElementById("score");
      const bestLabel = document.getElementById("best");
      const skinButtons = document.querySelectorAll(".skin-swatch");
      const columns = 40;
      const rows = 27;
      const baseSpeed = 145;
      const minimumSpeed = 68;
      const speedStep = 5;
      const skins = {
        lime: { head: "#d6ff83", body: "#a8ed45", glow: "rgba(184, 255, 79, .54)", eye: "#17230e" },
        cyan: { head: "#a5f5ff", body: "#55dff3", glow: "rgba(85, 230, 255, .56)", eye: "#092329" },
        violet: { head: "#e0c0ff", body: "#b783f4", glow: "rgba(193, 138, 255, .56)", eye: "#251638" },
        orange: { head: "#ffe0ad", body: "#ff9b49", glow: "rgba(255, 173, 92, .56)", eye: "#321b0c" }
      };
      const directions = {
        ArrowUp: { x: 0, y: -1 },
        w: { x: 0, y: -1 },
        ArrowDown: { x: 0, y: 1 },
        s: { x: 0, y: 1 },
        ArrowLeft: { x: -1, y: 0 },
        a: { x: -1, y: 0 },
        ArrowRight: { x: 1, y: 0 },
        d: { x: 1, y: 0 }
      };
      let snake;
      let food;
      let direction;
      let queuedDirection;
      let score = 0;
      let best = Number(localStorage.getItem("neon-snake-best")) || 0;
      let skin = skins[localStorage.getItem("neon-snake-skin")] ? localStorage.getItem("neon-snake-skin") : "lime";
      let timer = null;
      let state = "ready";

      bestLabel.textContent = String(best).padStart(3, "0");
      updateSkinButtons();

      function updateSkinButtons() {
        skinButtons.forEach(button => {
          button.setAttribute("aria-pressed", String(button.dataset.skin === skin));
        });
      }

      function selectSkin(name) {
        if (!skins[name]) return;
        skin = name;
        localStorage.setItem("neon-snake-skin", skin);
        updateSkinButtons();
        draw();
      }

      function resizeCanvas() {
        const bounds = shell.getBoundingClientRect();
        const pixelRatio = Math.min(window.devicePixelRatio || 1, 2);
        canvas.width = Math.round(bounds.width * pixelRatio);
        canvas.height = Math.round(bounds.width * (rows / columns) * pixelRatio);
        ctx.setTransform(pixelRatio * canvas.width / (columns * pixelRatio), 0, 0,
          pixelRatio * canvas.height / (rows * pixelRatio), 0, 0);
        draw();
      }

      function reset() {
        snake = [
          { x: 17, y: 13 },
          { x: 16, y: 13 },
          { x: 15, y: 13 },
          { x: 14, y: 13 }
        ];
        direction = { x: 1, y: 0 };
        queuedDirection = direction;
        score = 0;
        scoreLabel.textContent = "000";
        placeFood();
        draw();
      }

      function placeFood() {
        do {
          food = {
            x: Math.floor(Math.random() * columns),
            y: Math.floor(Math.random() * rows)
          };
        } while (snake.some(segment => segment.x === food.x && segment.y === food.y));
      }

      function setOverlay(mode) {
        state = mode;
        overlay.hidden = mode === "playing";
        if (mode === "ready") {
          title.textContent = "Ready to play?";
          copy.textContent = "Collect the glowing orbs, grow your snake, and see how high you can score.";
          icon.textContent = "✦";
          startButton.textContent = "Start game";
        } else if (mode === "over") {
          title.textContent = "Game over";
          copy.textContent = `You scored ${score} point${score === 1 ? "" : "s"}. Ready for another run?`;
          icon.textContent = "↻";
          startButton.textContent = "Play again";
        }
      }

      function startGame() {
        clearTimeout(timer);
        reset();
        setOverlay("playing");
        scheduleTick();
      }

      function scheduleTick() {
        const speed = Math.max(minimumSpeed, baseSpeed - Math.floor(score / 50) * speedStep);
        timer = window.setTimeout(() => {
          tick();
          if (state === "playing") scheduleTick();
        }, speed);
      }

      function tick() {
        direction = queuedDirection;
        const head = { x: snake[0].x + direction.x, y: snake[0].y + direction.y };
        const ate = head.x === food.x && head.y === food.y;
        const bodyToCheck = ate ? snake : snake.slice(0, -1);

        if (head.x < 0 || head.x >= columns || head.y < 0 || head.y >= rows ||
            bodyToCheck.some(segment => segment.x === head.x && segment.y === head.y)) {
          endGame();
          return;
        }

        snake.unshift(head);
        if (ate) {
          score += 10;
          scoreLabel.textContent = String(score).padStart(3, "0");
          if (score > best) {
            best = score;
            bestLabel.textContent = String(best).padStart(3, "0");
            localStorage.setItem("neon-snake-best", String(best));
          }
          placeFood();
        } else {
          snake.pop();
        }
        draw();
      }

      function endGame() {
        clearTimeout(timer);
        draw();
        setOverlay("over");
        startButton.focus();
      }

      function draw() {
        if (!ctx || !canvas.width || !canvas.height) return;
        const cellWidth = canvas.width / (window.devicePixelRatio > 2 ? 2 : window.devicePixelRatio || 1) / columns;
        ctx.clearRect(0, 0, columns, rows);
        ctx.fillStyle = "#0b1117";
        ctx.fillRect(0, 0, columns, rows);

        ctx.beginPath();
        for (let x = 1; x < columns; x++) {
          ctx.moveTo(x, 0);
          ctx.lineTo(x, rows);
        }
        for (let y = 1; y < rows; y++) {
          ctx.moveTo(0, y);
          ctx.lineTo(columns, y);
        }
        ctx.strokeStyle = "rgba(148, 179, 190, .055)";
        ctx.lineWidth = Math.max(.035, .7 / cellWidth);
        ctx.stroke();

        if (food) {
          ctx.save();
          ctx.shadowColor = "#ff5ba8";
          ctx.shadowBlur = .6;
          ctx.fillStyle = "#ff5ba8";
          ctx.beginPath();
          ctx.arc(food.x + .5, food.y + .5, .31, 0, Math.PI * 2);
          ctx.fill();
          ctx.shadowBlur = 0;
          ctx.fillStyle = "rgba(255,255,255,.8)";
          ctx.beginPath();
          ctx.arc(food.x + .39, food.y + .38, .075, 0, Math.PI * 2);
          ctx.fill();
          ctx.restore();
        }

        if (!snake) return;
        snake.forEach((segment, index) => {
          const inset = index === 0 ? .075 : .105;
          const size = 1 - inset * 2;
          const alpha = Math.max(.48, 1 - index * .023);
          ctx.save();
          if (index === 0) {
            ctx.shadowColor = skins[skin].glow;
            ctx.shadowBlur = .38;
          }
          ctx.globalAlpha = alpha;
          ctx.fillStyle = index === 0 ? skins[skin].head : skins[skin].body;
          roundedRect(ctx, segment.x + inset, segment.y + inset, size, size, .2);
          ctx.fill();
          ctx.restore();

          if (index === 0) drawEyes(segment);
        });
      }

      function roundedRect(context, x, y, width, height, radius) {
        context.beginPath();
        context.roundRect(x, y, width, height, radius);
      }

      function drawEyes(head) {
        const eyeOffset = .22;
        const forward = .14;
        const perp = { x: -direction.y, y: direction.x };
        const centerX = head.x + .5 + direction.x * forward;
        const centerY = head.y + .5 + direction.y * forward;
        for (const side of [-1, 1]) {
          ctx.fillStyle = skins[skin].eye;
          ctx.beginPath();
          ctx.arc(centerX + perp.x * eyeOffset * side, centerY + perp.y * eyeOffset * side, .055, 0, Math.PI * 2);
          ctx.fill();
        }
      }

      function changeDirection(next) {
        if (state !== "playing") return;
        if (next.x === -queuedDirection.x && next.y === -queuedDirection.y) return;
        queuedDirection = next;
      }

      startButton.addEventListener("click", startGame);
      skinButtons.forEach(button => {
        button.addEventListener("click", () => selectSkin(button.dataset.skin));
      });
      window.addEventListener("keydown", event => {
        const key = event.key.length === 1 ? event.key.toLowerCase() : event.key;
        const next = directions[key];
        if (next) {
          event.preventDefault();
          changeDirection(next);
        } else if ((key === " " || key === "Enter") && state !== "playing") {
          event.preventDefault();
          startGame();
        }
      });

      let touchStart = null;
      shell.addEventListener("pointerdown", event => {
        touchStart = { x: event.clientX, y: event.clientY };
      });
      shell.addEventListener("pointerup", event => {
        if (!touchStart) return;
        const dx = event.clientX - touchStart.x;
        const dy = event.clientY - touchStart.y;
        touchStart = null;
        if (Math.max(Math.abs(dx), Math.abs(dy)) < 18) return;
        if (Math.abs(dx) > Math.abs(dy)) changeDirection({ x: Math.sign(dx), y: 0 });
        else changeDirection({ x: 0, y: Math.sign(dy) });
      });

      const observer = new ResizeObserver(resizeCanvas);
      observer.observe(shell);
      reset();
      setOverlay("ready");
      resizeCanvas();
    })();
  </script>
</body>
</html>
